name: Pulumi Setup
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      comment-on-pr:
        required: false
        type: boolean
        default: false
      expect-no-changes:
        required: false
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-slim
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v2.1.0
        with:
          organization: diazdesandi
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:diazdesandi

      - name: Verify GitHub PAT for provider
        run: |
          if [ -z "$PULUMI_GITHUB_TOKEN" ]; then
            echo "::error::Repository secret PULUMI_GITHUB_TOKEN is missing or empty."
            echo "::error::Add a classic PAT (admin:org + repo) under Settings → Secrets → Actions."
            echo "::error::Pulumi Cloud stack github:token is not used in CI — Actions always sets GITHUB_TOKEN unless overridden here."
            exit 1
          fi
        env:
          PULUMI_GITHUB_TOKEN: ${{ secrets.PULUMI_GITHUB_TOKEN }}

      - name: Run Pulumi ${{ inputs.command }}
        uses: pulumi/actions@v7
        env:
          # Override the job's default GITHUB_TOKEN — Actions' integration token
          # cannot manage org teams, labels, or cross-repo resources.
          GITHUB_TOKEN: ${{ secrets.PULUMI_GITHUB_TOKEN }}
        with:
          command: ${{ inputs.command }}
          stack-name: diazdesandi/dev
          comment-on-pr: ${{ inputs.comment-on-pr }}
          expect-no-changes: ${{ inputs.expect-no-changes }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
