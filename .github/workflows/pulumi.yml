name: Pulumi Setup
on:
  workflow_call:
    inputs:
      command:
        required: true
        type: string
      comment-on-pr:
        required: false
        type: boolean
        default: false
      expect-no-changes:
        required: false
        type: boolean
        default: false

jobs:
  run:
    if: github.repository == 'thaw-app/platform'
    runs-on: ubuntu-slim
    env:
      HUSKY: 0
      # Only `up` gets the admin PAT. A preview runs the pull request's own
      # code, so it gets the read-only token when that secret is set, and falls
      # back to the admin PAT until then.
      PROVIDER_TOKEN: ${{ inputs.command == 'up' && secrets.PULUMI_GITHUB_TOKEN || secrets.PULUMI_GITHUB_READ_TOKEN || secrets.PULUMI_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622 # v2.1.1
        with:
          organization: diazdesandi
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:diazdesandi

      - name: Verify GitHub PAT for provider
        run: |
          if [ -z "$PROVIDER_TOKEN" ]; then
            echo "::error::Repository secret PULUMI_GITHUB_TOKEN is missing or empty."
            echo "::error::Add a classic PAT (admin:org + repo) under Settings → Secrets → Actions."
            echo "::error::Pulumi Cloud stack github:token is not used in CI: Actions always sets GITHUB_TOKEN unless overridden here."
            exit 1
          fi

      - name: Run Pulumi ${{ inputs.command }}
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        env:
          # Override the job's default GITHUB_TOKEN: Actions' integration token
          # cannot read or manage org teams, labels, or cross-repo resources.
          GITHUB_TOKEN: ${{ env.PROVIDER_TOKEN }}
        with:
          command: ${{ inputs.command }}
          stack-name: diazdesandi/dev
          # Read GitHub's current settings first, so a change made by hand
          # shows up in the plan and config wins on apply.
          refresh: true
          comment-on-pr: ${{ inputs.comment-on-pr }}
          expect-no-changes: ${{ inputs.expect-no-changes }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
