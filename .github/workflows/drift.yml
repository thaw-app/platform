name: Drift detection
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — off the :00 cron stampede
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: pulumi-deploy
  cancel-in-progress: false

jobs:
  preview:
    uses: ./.github/workflows/pulumi.yml
    secrets: inherit
    with:
      command: preview
      expect-no-changes: true

  report:
    needs: preview
    if: failure()
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Open drift issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"Drift detected\"" --json number --jq length)
          if [ "$existing" -eq 0 ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Drift detected between Pulumi state and GitHub org" \
              --body "Scheduled \`pulumi preview --expect-no-changes\` failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — review the preview diff; either fold the change into config/ or revert it in the GitHub UI."
          fi

  cleanup:
    needs: preview
    if: success()
    runs-on: ubuntu-slim
    permissions:
      issues: write
    steps:
      - name: Close resolved drift issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Drift detected"' --json number --jq '.[].number' |
          while read -r n; do
            [ -n "$n" ] || continue
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" \
              --comment "Scheduled drift check passed; closing as resolved."
          done
