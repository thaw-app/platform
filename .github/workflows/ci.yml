name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pulumi-deploy' || format('ci-{0}', github.workflow_ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  HUSKY: 0

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Biome lint
        run: bun run check

      - name: Run tests
        run: bun test --coverage --coverage-reporter=lcov

      - name: SonarQube Scan
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  preview:
    if: github.event_name == 'pull_request'
    needs: test
    permissions:
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/pulumi.yml
    secrets: inherit
    with:
      command: preview
      comment-on-pr: true

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    permissions:
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/pulumi.yml
    secrets: inherit
    with:
      command: up
