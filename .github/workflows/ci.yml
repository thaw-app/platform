name: CI/CD
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  merge_group:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'pulumi-deploy' || format('ci-{0}', github.workflow_ref) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  HUSKY: 0

jobs:
  test:
    if: |
      github.repository == 'thaw-app/platform' &&
      (
        github.event_name == 'pull_request' ||
        github.event_name == 'merge_group' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          !startsWith(github.event.head_commit.message, 'Merge pull request') &&
          !contains(github.event.head_commit.message, '(#')
        )
      )
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: bun run typecheck

      - name: Biome lint
        run: bun run check

      - name: Run tests
        run: bun test

  # Its own job, so a SonarCloud outage or a rejected token shows up as a red
  # check without holding back the preview or the deploy.
  sonar:
    if: |
      github.repository == 'thaw-app/platform' &&
      (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for SonarCloud SCM blame / issue assignment

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run tests with coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  preview:
    if: github.repository == 'thaw-app/platform' && github.event_name == 'pull_request'
    needs: test
    permissions:
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/pulumi.yml
    secrets: inherit
    with:
      command: preview
      comment-on-pr: true

  deploy:
    needs: test
    if: |
      github.repository == 'thaw-app/platform' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      always() &&
      !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    permissions:
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/pulumi.yml
    secrets: inherit
    with:
      command: up
