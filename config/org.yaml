# yaml-language-server: $schema=./schema/org.schema.json
owner: stonerl
organization: thaw-app

defaults:
  visibility: public
  defaultBranch: main
  deleteBranchOnMerge: true
  mergeStrategies:
    - squash
  squashMergeCommitTitle: PR_TITLE
  squashMergeCommitMessage: COMMIT_MESSAGES
  features:
    issues: true
    wiki: false
    projects: false
    discussions: false
  # Secret scanning and push protection reach public repos only: GitHub Free
  # does not offer them on private ones.
  security:
    dependabotAlerts: true
    dependabotSecurityUpdates: true
    secretScanning: true
    pushProtection: true
  # How a synced .github/dependabot.yml behaves, matching Thaw's. A repo opts
  # in by listing its ecosystems under `dependabot` in repos.yaml.
  dependabot:
    interval: weekly
    day: monday
    openPullRequestsLimit: 10
    labels:
      - dependencies
    assignees:
      - diazdesandi
