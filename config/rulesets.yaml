# yaml-language-server: $schema=./schema/rulesets.schema.json
#
# Org-wide default-branch rules for managed repositories (~ALL). All work merges
# to main; squash-only merges, 2 reviews, CODEOWNERS.
# Managed-repo workflows should expose one CI job named `ci`, `build`, or `test`
# (and run on merge_group when merge queue is enabled). GitHub rulesets cannot
# express "any one of" — acceptAnyOf is validated here; pin a name per-repo via
# branchProtection when needed.
#
# On GitHub Free (enableRulesets: false), org rulesets are not available (404).
# The same policy is provisioned as a RepositoryRuleset on every managed repo in
# repos.yaml. Set enableRulesets: true only if the org upgrades to Team+.
rulesets:
  - id: repo-main-default
    name: Default branch protection
    target: branch
    enforcement: active
    # Org owners + repo admins can skip required checks/reviews when needed.
    bypassActors:
      - actorType: OrganizationAdmin
        actorId: 1
        bypassMode: always
      - actorType: RepositoryRole
        actorId: 5 # repository admin
        bypassMode: always
    conditions:
      refName:
        includes:
          - "~DEFAULT_BRANCH"
    rules:
      creation: true
      update: false
      deletion: true
      nonFastForward: true
      requiredLinearHistory: true
      requiredSignatures: false
      copilotCodeReview:
        reviewDraftPullRequests: false
        reviewOnPush: false
      pullRequest:
        requiredApprovingReviewCount: 2
        dismissStaleReviewsOnPush: true
        requireCodeOwnerReview: true
        requireLastPushApproval: true
        requiredReviewThreadResolution: true
        allowedMergeMethods:
          - squash
      requiredStatusChecks:
        enabled: true
        acceptAnyOf: [ci, build, test]
        strictRequiredStatusChecksPolicy: true
        doNotEnforceOnCreate: false
      requiredCodeScanning:
        enabled: false
      mergeQueue:
        enabled: false
        mergeMethod: SQUASH
        groupingStrategy: ALLGREEN
      requiredDeployments:
        enabled: false
