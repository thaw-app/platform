# yaml-language-server: $schema=./schema/rulesets.schema.json
#
# Org-wide branch rules for managed repositories (~ALL). Mirrors the thaw-app
# default-branch policy: squash-only merges, 2 reviews, CODEOWNERS, merge queue.
# Managed-repo workflows should expose one CI job named `ci`, `build`, or `test`
# (and run on merge_group when merge queue is enabled). GitHub rulesets cannot
# express "any one of" — acceptAnyOf is validated here; pin a name per-repo via
# branchProtection when needed.
#
# GitHub organization rulesets require a Team or Enterprise org plan. On Free,
# POST /orgs/{org}/rulesets returns 404 — set enableRulesets: false on the
# stack until thaw-app is upgraded, or enforce branch policy per-repo / in the UI.
rulesets:
  - id: repo-main-default
    name: Default branch protection
    target: branch
    enforcement: active
    conditions:
      refName:
        includes:
          - "~DEFAULT_BRANCH"
    rules: &default_branch_rules
      creation: true
      update: false
      deletion: true
      nonFastForward: true
      requiredLinearHistory: true
      requiredSignatures: false
      copilotCodeReview:
        reviewDraftPullRequests: false
        reviewOnPush: false
      pullRequest:
        requiredApprovingReviewCount: 2
        dismissStaleReviewsOnPush: true
        requireCodeOwnerReview: true
        requireLastPushApproval: true
        requiredReviewThreadResolution: true
        allowedMergeMethods:
          - squash
      requiredStatusChecks:
        enabled: true
        acceptAnyOf: [ci, build, test]
        strictRequiredStatusChecksPolicy: true
        doNotEnforceOnCreate: false
      requiredCodeScanning:
        enabled: false
      mergeQueue:
        enabled: false # not provisionable on org rulesets via @pulumi/github — enable in GitHub UI
        mergeMethod: SQUASH
        groupingStrategy: ALLGREEN
      requiredDeployments:
        enabled: false

  - id: release-branch-protection
    name: Release branch protection
    target: branch
    enforcement: active
    conditions:
      refName:
        includes:
          - "refs/heads/release/*"
    rules: *default_branch_rules
