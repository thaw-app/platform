# yaml-language-server: $schema=./schema/repos.schema.json
#
# Pulumi-managed repositories for thaw-app.
# Out of scope (manual admin, not listed here): Thaw, AXSwift
#
# Branch enforcement is org-wide via config/rulesets.yaml — do not duplicate
# branchProtection here unless a repo needs an explicit exception.
repos:
  - name: website
    description: Thaw project website and Sparkle appcast (GitHub Pages).
    visibility: public
    homepage: https://thaw-app.github.io/website/
    topics:
      - thaw
      - macos
      - menu-bar
      - website
      - github-pages
      - documentation
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true

  - name: homebrew-tap
    description: Homebrew tap formulas for Thaw releases.
    visibility: public
    topics:
      - thaw
      - macos
      - homebrew
      - homebrew-tap
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true

  - name: dot-github
    description: Shared organization workflows, issue templates, and defaults.
    visibility: public
    topics:
      - github-actions
      - workflows
      - templates
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true

  - name: org-ci
    description: Organization-wide CI/CD workflows and automation scripts.
    visibility: public
    topics:
      - ci
      - cd
      - automation
      - github-actions
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
