# yaml-language-server: $schema=./schema/repos.schema.json
#
# Pulumi-managed repositories for thaw-app.
# Out of scope (manual admin, not listed here): Thaw, prk-bin, shieldcn,
# AXSwift6, and platform itself.
#
# `adopt: true` imports an existing repo on its first apply and is removed
# afterwards; every repo below is already imported.
#
# Branch enforcement is defined in config/rulesets.yaml, which lists the repos
# each ruleset is on. A repo on a ruleset that requires status checks names its
# own CI checks here (requiredStatusChecks).
repos:
  - name: website
    description: The website for Thaw and Floe, at getthaw.app.
    visibility: public
    homepage: https://www.getthaw.app
    topics:
      - thaw
      - macos
      - menu-bar
      - website
      - documentation
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
    dependabot:
      - bun
      - github-actions

  - name: updates
    description: >-
      Sparkle appcast and signed update metadata for Thaw (GitHub Pages).
      Stable public feed for in-app updates; written by release automation only.
    visibility: public
    homepage: https://thaw-app.github.io/updates/
    topics:
      - thaw
      - macos
      - sparkle
      - appcast
      - github-pages
      - updates
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
    hasIssues: false
    hasWiki: false
    hasProjects: false
    hasDiscussions: false

  - name: homebrew-tap
    description: Homebrew tap formulas for Thaw releases.
    visibility: public
    topics:
      - thaw
      - macos
      - homebrew
      - homebrew-tap
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true

  - name: brand-assets
    description: "Shared Thaw brand assets: headers, icons, packaging art, marketing."
    visibility: public
    bare: true
    hasIssues: false
    hasWiki: false
    hasProjects: false
    hasDiscussions: false

  - name: menubarspawner
    description: Small macOS menu-bar helper that spawns customizable status items.
    visibility: public
    topics:
      - thaw
      - macos
      - menubar
      - swift
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false

  - name: raycast-extension
    description: Control Thaw directly from Raycast. Toggle visibility sections, search menu bar items, and open settings without touching your mouse.
    visibility: public
    homepage: https://www.raycast.com/diazdesandi/thaw
    topics:
      - thaw
      - macos
      - raycast-extension
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false
    requiredStatusChecks:
      - ci
    dependabot:
      - npm
      - github-actions

  # The SwiftUI controls Thaw and Floe share. Created empty; the checks it will
  # require are named here, and it moves to the stricter ruleset, once it has CI.
  - name: ThawUI
    description: The SwiftUI controls and styles shared by Thaw and Floe.
    visibility: public
    topics:
      - thaw
      - macos
      - swift
      - swiftui
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
    dependabot:
      - swift
      - github-actions

  # Private, proprietary source: bare, so no org labels or CODEOWNERS. Rulesets
  # are unavailable for private repos on GitHub Free, so no ruleset in
  # config/rulesets.yaml lists it.
  - name: PlatformRuntimeKit
    description: Proprietary Swift package providing current-platform menu bar runtime support for Thaw.
    visibility: private
    bare: true
    autoInit: false

  - name: .github
    pulumiName: dot-github
    description: Shared organization workflows, issue templates, and defaults.
    visibility: public
    topics:
      - github-actions
      - workflows
      - templates
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false

  - name: org-ci
    description: Organization-wide CI/CD workflows and automation scripts.
    visibility: public
    topics:
      - ci
      - cd
      - automation
      - github-actions
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
    # test-actions.yml runs on every pull request; actionlint only when a
    # workflow or action file changes, so it cannot be required.
    requiredStatusChecks:
      - test
    dependabot:
      - bun
      # The workflows, and the actions each composite action calls.
      - ecosystem: github-actions
        directories:
          - "/"
          - "/actions/*"

  # Floe keeps its own labels (bare) and has one code owner. Its main branch is
  # protected the way Thaw's development branch is, with Floe's own check names:
  # lint is what Thaw calls static_analysis.
  - name: Floe
    description: The open source launcher for macOS
    visibility: public
    homepage: https://www.getthaw.app/floe
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false
    bare: true
    hasWiki: true
    hasProjects: true
    hasDiscussions: true
    codeowners: |
      * @diazdesandi
    branchProtection:
      main:
        requiredReviewCount: 1
        dismissStaleReviews: true
        requireCodeOwnerReviews: true
        requireLastPushApproval: true
        requiredStatusChecks:
          - lint
          - build
          - sonarqube
          - dependency-sca
        strictStatusChecks: true
        requireSignedCommits: true
        requiredLinearHistory: true
        requireConversationResolution: true
        allowsForcePushes: false
        allowsDeletions: false
        enforceAdmins: false
