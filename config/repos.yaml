# yaml-language-server: $schema=./schema/repos.schema.json
#
# Pulumi-managed repositories for thaw-app.
# Out of scope (manual admin, not listed here): Thaw, AXSwift
#
# Branch enforcement is defined in config/rulesets.yaml and applied per-repo
# when enableRulesets is false (GitHub Free). Use branchProtection here only
# for repo-specific overrides (e.g. pin a CI check name).
repos:
  - name: website
    description: Thaw project website (GitHub Pages).
    visibility: public
    homepage: https://thaw-app.github.io/website/
    topics:
      - thaw
      - macos
      - menu-bar
      - website
      - github-pages
      - documentation
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true

  - name: updates
    description: >-
      Sparkle appcast and signed update metadata for Thaw (GitHub Pages).
      Stable public feed for in-app updates; written by release automation only.
    visibility: public
    homepage: https://thaw-app.github.io/updates/
    topics:
      - thaw
      - macos
      - sparkle
      - appcast
      - github-pages
      - updates
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
    hasIssues: false
    hasWiki: false
    hasProjects: false
    hasDiscussions: false

  - name: homebrew-tap
    description: Homebrew tap formulas for Thaw releases.
    visibility: public
    topics:
      - thaw
      - macos
      - homebrew
      - homebrew-tap
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true

  - name: brand-assets
    description: Shared Thaw brand assets — headers, icons, packaging art, marketing.
    visibility: public
    adopt: true
    bare: true
    hasIssues: false
    hasWiki: false
    hasProjects: false
    hasDiscussions: false

  - name: menubarspawner
    description: Small macOS menu-bar helper that spawns customizable status items.
    visibility: public
    topics:
      - thaw
      - macos
      - menubar
      - swift
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false
    adopt: true

  - name: raycast-extension
    description: Control Thaw directly from Raycast. Toggle visibility sections, search menu bar items, and open settings without touching your mouse.
    visibility: public
    topics:
      - thaw
      - macos
      - raycast-extension
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false
    adopt: true

  - name: .github
    pulumiName: dot-github
    description: Shared organization workflows, issue templates, and defaults.
    visibility: public
    topics:
      - github-actions
      - workflows
      - templates
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: false

  - name: org-ci
    description: Organization-wide CI/CD workflows and automation scripts.
    visibility: public
    topics:
      - ci
      - cd
      - automation
      - github-actions
    mergeStrategies:
      - squash
    deleteBranchOnMerge: true
    autoInit: true
