# yaml-language-server: $schema=./schema/teams.schema.json
teams:
  - slug: maintainers
    name: Maintainers
    privacy: closed
    description: Core maintainers for Thaw repositories

  - slug: contributors
    name: Contributors
    privacy: closed
    description: Day-to-day contributors with write access

repoAccess:
  website:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  # Maintainers only: the feed must stay writable by CI and admins, not by
  # day-to-day pushes.
  updates:
    - team: maintainers
      permission: admin

  homebrew-tap:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  menubarspawner:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  raycast-extension:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  PlatformRuntimeKit:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  ".github":
    - team: maintainers
      permission: admin

  org-ci:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push
