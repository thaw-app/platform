# yaml-language-server: $schema=./schema/teams.schema.json
teams:
  - slug: maintainers
    name: Maintainers
    privacy: closed
    description: Core maintainers for Thaw repositories

  - slug: contributors
    name: Contributors
    privacy: closed
    description: Day-to-day contributors with write access

repoAccess:
  website:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  homebrew-tap:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  menubarspawner:
    - team: maintainers
      permission: admin
    - team: contributors
      permission: push

  ".github":
    - team: maintainers
      permission: admin

  org-ci:
    - team: maintainers
      permission: admin
